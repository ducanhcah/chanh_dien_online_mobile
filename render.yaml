services:
  - type: web
    name: chanh-dien-live-mobile
    runtime: node
    rootDir: live
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://live-kappa-ruby.vercel.app
      - key: ALLOWED_TIKTOK_USERS
        value: phatpt_diamond
